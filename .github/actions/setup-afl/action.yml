name: Set up AFL++ toolchain
description: >
  Build and install AFL++ from source, then install the Rust toolchain pinned
  by upstream LEZ (cargo-afl works on stable, unlike cargo-fuzz) and cargo-afl.
  The repository and logos-execution-zone (checkout-lez) must already be
  checked out before this runs. The exported RUSTUP_TOOLCHAIN keeps cargo-afl's
  instrumentation runtime and later `cargo afl build` steps on the same
  rustc/LLVM.

inputs:
  afl-version:
    description: AFL++ git tag to build from source.
    required: false
    default: v4.40c

runs:
  using: composite
  steps:
    - name: Install AFL++ ${{ inputs.afl-version }} from source
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y \
          build-essential python3-dev automake cmake \
          flex bison libglib2.0-dev libpixman-1-dev \
          python3-setuptools ninja-build
        git clone --depth 1 --branch ${{ inputs.afl-version }} \
          https://github.com/AFLplusplus/AFLplusplus /tmp/aflplusplus
        cd /tmp/aflplusplus
        make distrib
        sudo make install
        afl-fuzz --version

    - name: Install Rust (upstream LEZ pin)
      uses: ./.github/actions/lez-rust-toolchain

    - name: Install cargo-afl
      shell: bash
      run: cargo install cargo-afl --locked

    # The fuzz targets execute guest programs via risc0's ExternalProver, which needs r0vm.
    - name: Install r0vm
      uses: ./.github/actions/install-r0vm
